[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workspace-continuity"
version = "0.1.0"
description = "Local-first, evidence-labeled workspace continuity for Claude Code, Codex, and other coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "JINGJAYHUANG" }
]
keywords = ["agents", "claude-code", "codex", "workspace", "continuity", "handoff", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JINGJAYHUANG/agent-workspace-continuity-template"
Repository = "https://github.com/JINGJAYHUANG/agent-workspace-continuity-template"
Issues = "https://github.com/JINGJAYHUANG/agent-workspace-continuity-template/issues"

[project.scripts]
awc = "agent_workspace_continuity.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_workspace_continuity = ["template_data/**/*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
