name: Feature request
description: Propose a narrow improvement to portability, evidence discipline, privacy, or recovery.
title: "proposal: "
labels: ["enhancement"]
body:
  - type: textarea
    id: failure_mode
    attributes:
      label: Failure mode
      description: What concrete continuity problem is not handled today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Privacy, security, and migration risks
    validations:
      required: true
