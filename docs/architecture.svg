<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agent Workspace Continuity architecture</title>
  <desc id="desc">Stable rules, evidence-labeled state, bounded recovery, and content-free local hook metadata.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#18243a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <text x="72" y="82" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="40" font-weight="700">Agent Workspace Continuity</text>
  <text x="72" y="124" fill="#a9b8d0" font-family="system-ui,sans-serif" font-size="22">Local-first rules, evidence-labeled state, bounded recovery</text>
  <g filter="url(#shadow)" font-family="system-ui,sans-serif">
    <rect x="72" y="178" width="300" height="300" rx="22" fill="#f8fafc"/>
    <text x="102" y="226" fill="#0f172a" font-size="24" font-weight="700">Stable rules</text>
    <rect x="102" y="258" width="240" height="70" rx="14" fill="#dbeafe"/>
    <text x="222" y="301" text-anchor="middle" fill="#1e3a8a" font-size="22" font-weight="600">AGENTS.md</text>
    <rect x="102" y="350" width="240" height="70" rx="14" fill="#ede9fe"/>
    <text x="222" y="393" text-anchor="middle" fill="#4c1d95" font-size="22" font-weight="600">CLAUDE.md</text>

    <rect x="450" y="178" width="300" height="300" rx="22" fill="#f8fafc"/>
    <text x="480" y="226" fill="#0f172a" font-size="24" font-weight="700">Recoverable state</text>
    <text x="480" y="277" fill="#334155" font-size="21">brief.md</text>
    <text x="480" y="319" fill="#334155" font-size="21">status.md</text>
    <text x="480" y="361" fill="#334155" font-size="21">handoff.md</text>
    <text x="480" y="403" fill="#64748b" font-size="19">optional: plan + decisions</text>
    <rect x="480" y="428" width="240" height="26" rx="13" fill="#dcfce7"/>
    <text x="600" y="447" text-anchor="middle" fill="#166534" font-size="15" font-weight="700">VERIFIED / INHERITED / UNKNOWN</text>

    <rect x="828" y="178" width="300" height="300" rx="22" fill="#f8fafc"/>
    <text x="858" y="226" fill="#0f172a" font-size="24" font-weight="700">Safe adapters</text>
    <rect x="858" y="258" width="240" height="70" rx="14" fill="#cffafe"/>
    <text x="978" y="290" text-anchor="middle" fill="#155e75" font-size="20" font-weight="600">bounded recovery</text>
    <text x="978" y="314" text-anchor="middle" fill="#155e75" font-size="16">source hashes</text>
    <rect x="858" y="350" width="240" height="70" rx="14" fill="#ffedd5"/>
    <text x="978" y="382" text-anchor="middle" fill="#9a3412" font-size="20" font-weight="600">content-free hooks</text>
    <text x="978" y="406" text-anchor="middle" fill="#9a3412" font-size="16">local ignored metadata</text>
  </g>
  <path d="M372 328 H450" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <path d="M750 328 H828" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <text x="72" y="556" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="20">Preview-first • non-destructive • zero runtime dependencies • synthetic examples</text>
</svg>
